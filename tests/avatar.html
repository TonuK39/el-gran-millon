<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de avatares</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #1b1530; color: #eee; display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; align-items: center; background: #120e22; }
  button { background: #2c2450; color: #fff; border: 1px solid #4b3f86; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button.on { background: #ffd23f; color: #222; }
  #stage { width: 100%; height: 100%; display: block; min-height: 0; }
  aside { padding: 10px; overflow: auto; background: #151026; }
  #preview { width: 260px; height: 260px; background: radial-gradient(#3a2f6a, #1d1638); border-radius: 12px; display: block; }
  select { width: 100%; margin: 3px 0; }
  #thumbs { grid-column: 1 / 3; display: flex; gap: 6px; padding: 8px; overflow-x: auto; background: #120e22; }
  #thumbs img { width: 64px; height: 64px; background: #3a2f6a; border-radius: 50%; border: 2px solid #fff3; }
  #err { color: #ff8080; white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<header id="bar"><b>Animación:</b></header>
<canvas id="stage"></canvas>
<aside>
  <canvas id="preview"></canvas>
  <div id="sel"></div>
  <div id="err"></div>
</aside>
<div id="thumbs"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildAvatar, setAvatarAnim, updateAvatar, disposeAvatar, AvatarStudio } from '../js/avatar.js';
import { AVATAR } from '../js/config.js';

const errBox = document.getElementById('err');
window.__errors = [];
const logErr = m => { window.__errors.push(String(m)); errBox.textContent += m + '\n'; };
window.addEventListener('error', e => logErr(e.message));
window.addEventListener('unhandledrejection', e => logErr(e.reason));

// ---- escenario con rejilla de avatares ----
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a2244');
scene.add(new THREE.HemisphereLight(0xfff4ea, 0x5b6280, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 6, 8); scene.add(key);
const fill = new THREE.DirectionalLight(0xd6e4ff, 0.7); fill.position.set(-5, 3, 4); scene.add(fill);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
camera.position.set(0, 7, 34);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 6.2, 0);
controls.update();

const C = AVATAR.colors.length;
const rows = [];
rows.push(AVATAR.colors.map((_, i) => ({ color: i, eyes: 0, mouth: 0, hat: 0 })));                      // colores
rows.push(AVATAR.hats.map((_, i) => ({ color: (i * 5 + 1) % C, eyes: i % 6, mouth: (i + 1) % 6, hat: i }))); // sombreros
rows.push(AVATAR.eyes.flatMap((_, i) => [{ color: 9, eyes: i, mouth: 0, hat: 0 }, { color: 10, eyes: i, mouth: 2, hat: 0 }]));   // ojos sobre blanco y gris
rows.push(AVATAR.mouths.flatMap((_, i) => [{ color: 9, eyes: 0, mouth: i, hat: 0 }, { color: 10, eyes: 0, mouth: i, hat: 0 }])); // bocas sobre blanco y gris
const avatars = [];
rows.forEach((row, r) => row.forEach((cfg, i) => {
  const a = buildAvatar(cfg);
  a.position.set((i - (row.length - 1) / 2) * 1.75, (rows.length - 1 - r) * 3.4, 0);
  scene.add(a);
  avatars.push(a);
}));
let meshCount = 0;
avatars.forEach(a => { let n = 0; a.traverse(o => { if (o.isMesh) n++; }); meshCount = Math.max(meshCount, n); });
console.log('max meshes per avatar:', meshCount);
window.__meshMax = meshCount;

// ---- botones de animación ----
const bar = document.getElementById('bar');
let cur = 'idle';
for (const name of ['idle', 'think', 'happy', 'sad', 'wave', 'dance', 'vote']) {
  const b = document.createElement('button');
  b.textContent = name; b.dataset.anim = name;
  if (name === cur) b.className = 'on';
  b.onclick = () => setAll(name);
  bar.appendChild(b);
}
function setAll(name) {
  cur = name;
  avatars.forEach(a => setAvatarAnim(a, name));
  bar.querySelectorAll('button[data-anim]').forEach(b => b.className = b.dataset.anim === name ? 'on' : '');
}
const pause = document.createElement('button');
pause.textContent = 'pausa'; let paused = false;
pause.onclick = () => { paused = !paused; pause.className = paused ? 'on' : ''; };
bar.appendChild(pause);
const rebuild = document.createElement('button');
rebuild.textContent = 'reconstruir (dispose)';
rebuild.onclick = () => avatars.forEach((a, i) => { const p = a.parent, pos = a.position.clone(), cfg = a.userData.cfg; disposeAvatar(a); const b = buildAvatar(cfg); b.position.copy(pos); p.add(b); setAvatarAnim(b, cur); avatars[i] = b; });
bar.appendChild(rebuild);

// ---- estudio ----
const studio = new AvatarStudio();
const pcfg = { color: 5, eyes: 0, mouth: 0, hat: 1 };
let panim = 'idle';
const sel = document.getElementById('sel');
for (const [k, list] of [['color', AVATAR.colorNames], ['eyes', AVATAR.eyeNames], ['mouth', AVATAR.mouthNames], ['hat', AVATAR.hatNames], ['anim', ['idle', 'think', 'happy', 'sad', 'wave', 'dance', 'vote']]]) {
  const s = document.createElement('select');
  list.forEach((n, i) => s.add(new Option(`${k}: ${n}`, i)));
  s.value = k === 'anim' ? 0 : pcfg[k];
  s.onchange = () => { if (k === 'anim') panim = list[s.value]; else pcfg[k] = +s.value; };
  sel.appendChild(s);
}
const pv = document.getElementById('preview');
const dpr = Math.min(2, devicePixelRatio || 1);
pv.width = Math.round(260 * dpr); pv.height = Math.round(260 * dpr);

// ---- miniaturas ----
const thumbs = document.getElementById('thumbs');
const thumbCfgs = [...rows[1], ...rows[0].slice(0, 6), { color: 9, eyes: 5, mouth: 4, hat: 7 }, { color: 10, eyes: 3, mouth: 5, hat: 4 }, { color: 'x', eyes: -1, mouth: 99 }, null];
for (const cfg of thumbCfgs) { const img = new Image(); img.src = studio.thumb(cfg, 128); thumbs.appendChild(img); }

// ---- bucle ----
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
}
let last = performance.now();
let simT = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) simT += dt;
  resize();
  avatars.forEach(a => updateAvatar(a, paused ? 0 : dt, simT));
  renderer.render(scene, camera);
  studio.preview(pcfg, pv, now / 1000, panim);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ganchos de depuración
window.__test = {
  THREE, camera, controls, avatars, studio, setAll,
  focus(i, dist = 4.5, yaw = 0) {
    const a = avatars[i]; const p = a.position.clone().add(new THREE.Vector3(0, 1.3, 0));
    controls.target.copy(p);
    camera.position.set(p.x + Math.sin(yaw) * dist, p.y + 0.6, p.z + Math.cos(yaw) * dist);
    controls.update();
  },
  overview() { controls.target.set(0, 6.2, 0); camera.position.set(0, 7, 34); controls.update(); },
  pause(v = true) { paused = v; },
  // avanza la simulación de forma determinista (sin depender de requestAnimationFrame)
  settle(sec = 2) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { simT += 1 / 60; avatars.forEach(a => updateAvatar(a, 1 / 60, simT)); } paused = true; renderer.render(scene, camera); },
};
</script>
</body>
</html>
